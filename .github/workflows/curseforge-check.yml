name: CurseForge check

# Run by hand (Actions tab > CurseForge check > Run workflow). Read-only: confirms the
# CF_API_KEY secret is accepted and which configured game versions CurseForge lists.
# Uploads nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04  # pinned, as in Fellowship Ledger
    steps:
      - uses: actions/checkout@v5
      - name: Check token and game versions
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 tools/build_release.py --check-curseforge
